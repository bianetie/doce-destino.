<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Doce Destino</title>
    <link rel="stylesheet" href="css/style.css">

</head>

<body>
 <section id="telaInicial">
    <h1>Doce Destino</h1>

    <p>
        Seu coração escolhe o caminho. ♡
    </p>

    <button id="botaoEntrar">
        ENTRAR
    </button>
     <button id="botaoInscrever">
         INSCREVER-SE
     </button>
   </section>  
    <section id="telaLogin">

    <h2>Entrar</h2>

    <label for="email">E-mail</label>

    <input
        type="email"
        id="email"
        placeholder="Digite seu e-mail"
    >

    <label for="senha">Senha</label>

    <input
        type="password"
        id="senha"
        placeholder="Digite sua senha"
    >

    <button id="botaoLogin">
        ENTRAR
    </button>

    <button id="botaoVoltarLogin">
        VOLTAR
    </button>

</section>
    <section id="telaCadastro">

    <h2>Inscrever-se</h2>

    <label for="nome">Nome</label>

    <input
        type="text"
        id="nome"
        placeholder="Digite seu nome"
    >

    <label for="emailCadastro">E-mail</label>

    <input
        type="email"
        id="emailCadastro"
        placeholder="Digite seu e-mail"
    >

    <label for="senhaCadastro">Senha</label>

    <input
        type="password"
        id="senhaCadastro"
        placeholder="Crie uma senha"
    >

    <button id="botaoCadastro">
        INSCREVER-SE
    </button>

    <button id="botaoVoltarCadastro">
        VOLTAR
    </button>

</section>
<script src="js/game.js"></script>
</body>

</html>
